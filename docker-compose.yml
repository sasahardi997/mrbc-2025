version: '3.8'
services:
  postgres:
    image: postgres:14
    container_name: library-postgres
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d library"]
      interval: 10s
      timeout: 5s
      retries: 5
